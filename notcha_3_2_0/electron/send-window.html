<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notcha • Send Files</title>
  <style>
    :root {
      --bg: rgba(13, 12, 18, 0.94);
      --surface: rgba(255, 255, 255, 0.04);
      --surface-hover: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.10);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --accent-soft: rgba(56, 189, 248, 0.12);
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: transparent;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    .window-shell {
      height: 100%;
      background: var(--bg);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 24px var(--accent-glow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Draggable Titlebar */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }
    .title-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--accent-soft);
      display: grid;
      place-items: center;
      color: var(--accent);
    }
    .title-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .title-text {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .target-device-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--success);
      font-size: 11px;
      font-weight: 600;
    }
    .target-device-pill.unpaired {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border);
      color: var(--text-dim);
    }
    .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .title-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }
    .btn-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-icon:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .btn-icon.active { color: var(--accent); background: var(--accent-soft); }
    .btn-icon svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
    .btn-icon.close:hover { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    /* Body */
    .content-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
      overflow: hidden;
    }

    /* Huge Drag & Drop Zone */
    .dropzone {
      flex: 1;
      min-height: 160px;
      border: 2px dashed rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      background: rgba(56, 189, 248, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      cursor: pointer;
      padding: 20px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      transform: scale(0.99);
      box-shadow: inset 0 0 24px rgba(56, 189, 248, 0.2);
    }
    .dropzone-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--accent-soft);
      display: grid;
      place-items: center;
      color: var(--accent);
      transition: transform 0.2s ease;
    }
    .dropzone.dragover .dropzone-circle { transform: scale(1.1); }
    .dropzone-circle svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2; }
    .dropzone-main-text { font-size: 15px; font-weight: 700; color: #fff; }
    .dropzone-sub-text { font-size: 11.5px; color: var(--text-dim); max-width: 280px; line-height: 1.4; }

    .browse-pill {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 14px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
      pointer-events: none;
    }

    /* Selected files list */
    .files-tray {
      display: none;
      flex-direction: column;
      gap: 8px;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .files-tray.active { display: flex; }
    .tray-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding-bottom: 2px;
    }
    .clear-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
    }
    .clear-btn:hover { color: var(--danger); }

    .file-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .chip-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .chip-icon {
      width: 20px;
      height: 20px;
      color: var(--accent);
      flex-shrink: 0;
    }
    .chip-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; }
    .chip-name {
      font-size: 12px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chip-size {
      font-size: 10.5px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .chip-del {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 2px 4px;
    }
    .chip-del:hover { color: var(--danger); }

    /* Action Footer */
    .action-footer {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .send-action-btn {
      width: 100%;
      background: var(--accent);
      color: #081119;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .send-action-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .send-action-btn:active { transform: scale(0.98); }
    .send-action-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .shared-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11.5px;
      color: var(--success);
      font-weight: 600;
    }
    .shared-banner.active { display: flex; }
  </style>
</head>
<body>
  <div class="window-shell">
    <!-- Draggable Header -->
    <header class="titlebar">
      <div class="title-left">
        <div class="title-icon">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <span class="title-text">Notcha Send</span>
        <div class="target-device-pill unpaired" id="targetDevicePill">
          <span class="pulse-dot"></span>
          <span id="targetDeviceName">All Devices</span>
        </div>
      </div>
      <div class="title-btns">
        <button class="btn-icon active" id="pinBtn" title="Toggle Keep on Top">
          <svg viewBox="0 0 24 24"><path d="M14 3l7 7-2 1-3 3 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 3-3z"/></svg>
        </button>
        <button class="btn-icon" id="minBtn" title="Minimize">
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="btn-icon close" id="closeBtn" title="Close Window">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </header>

    <!-- Content -->
    <main class="content-body">
      <!-- Drag & Drop Zone -->
      <div class="dropzone" id="dropzone">
        <div class="dropzone-circle">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="dropzone-main-text">Drop files or folders here</div>
        <div class="dropzone-sub-text">Drag items directly from Finder or Desktop to stream to your phone</div>
        <div class="browse-pill">or click to browse</div>
      </div>

      <!-- Selected Files Tray -->
      <div class="files-tray" id="filesTray">
        <div class="tray-header">
          <span id="trayCountText">0 Files Selected</span>
          <button class="clear-btn" id="clearTrayBtn">Clear All</button>
        </div>
        <div id="fileChipsContainer" style="display: flex; flex-direction: column; gap: 6px;"></div>
      </div>

      <!-- Action Footer -->
      <div class="action-footer">
        <div class="shared-banner" id="sharedBanner">
          <span id="sharedBannerText">✓ Sharing active with phone</span>
          <button class="clear-btn" id="stopSharingBtn" style="color:var(--text-dim);">Stop</button>
        </div>

        <button class="send-action-btn" id="sendBtn" style="display: none;">
          <svg viewBox="0 0 24 24"><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span id="sendBtnText">Share with Mobile Device</span>
        </button>
      </div>
    </main>
  </div>

  <script src="send-window.js"></script>
</body>
</html>
